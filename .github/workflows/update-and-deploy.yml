```yaml
name: Update ETF data and deploy website

on:
  workflow_dispatch:
  schedule:
    - cron: "50 15 * * 1-5"
    - cron: "40 0 * * 2-6"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: etf-pages-deployment
  cancel-in-progress: false

jobs:

  # 第一阶段：更新数据、生成网页、上传部署文件
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Update ETF data and regenerate HTML
        run: python update_etf_tracker.py

      - name: Save updated data and generated HTML
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/etf_share_cache.json data/broad_etf_cache.json etf_share_tracker.html

          if ! git diff --cached --quiet; then
            git commit -m "chore: update ETF data"
            git push
          else
            echo "No data changes to commit."
          fi

      - name: Prepare static website
        run: |
          mkdir -p site

          test -s etf_share_tracker.html
          test -s echarts.min.js

          cp etf_share_tracker.html site/index.html
          cp echarts.min.js site/echarts.min.js

          echo "Website files prepared:"
          ls -lah site

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload website artifact
        id: upload
        uses: actions/upload-pages-artifact@v4
        with:
          name: github-pages
          path: site
          retention-days: 1

      - name: Verify uploaded artifact
        run: |
          echo "Uploaded artifact ID: ${{ steps.upload.outputs.artifact_id }}"
          test -n "${{ steps.upload.outputs.artifact_id }}"

  # 第二阶段：等待第一阶段完成，再部署网站
  deploy:
    needs: build
    runs-on: ubuntu-latest

    permissions:
      pages: write
      id-token: write
      contents: read

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages
